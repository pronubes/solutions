FormatVersion: 1
Tags:
  - OPC
  - MDC
  - MQTT
IconFile: "mqtt.svg"
DisplayName:
  DE: "OPC Multi Data Change zu MQTT"
  EN: "OPC Multi Data Change to MQTT"
ShortDescription:
  DE: "OPC Multi Datachange Trigger Datenübertragung zu MQTT"
  EN: "OPC Multi Datachange Trigger data transfer to MQTT"
Parameters:
  mqtt_broker_address:
    Type: "String"
    Label:
      DE: "MQTT Broker Hostadresse"
      EN: "MQTT broker host address"
  mqtt_port:
    Type: "Integer"
    Label:
      DE: "MQTT Port"
      EN: "MQTT port"
    Default: 1883
    Min: 0
    Max: 65535
  mqtt_protocol_version:
    Type: "Dropdown"
    Label:
      DE: "MQTT Version"
      EN: "MQTT version"
    Items:
      - Value: "V_5"
        DisplayText: "5"
      - Value: "V3_1"
        DisplayText: "3.1"
      - Value: "V3_1_1"
        DisplayText: "3.1.1"
    Default: "V3_1_1"
  opc_client_endpoint:
    Type: "String"
    Label:
      DE: "OPC-UA Endpunkt"
      EN: "OPC-UA endpoint"
    HelpText:
      DE: "Adresse für die Verbindung zum OPC Server"
      EN: "Address for the connection to the opc server"
    Default: "opc.tcp://localhost:49320"
  refresh_mdc_items:
    Type: "Boolean"
    Label:
      DE: "Items aktualisieren"
      EN: "Refresh items"
    HelpText:
      DE: |-
        Wenn diese Option aktiv ist, werden zyklisch die überwachten Items aktualisiert.
        Diese Option sollte nur aktiviert werden, wenn die Datenstruktur nicht statisch ist und sich verändern kann.
      EN: |-
        When this option is enabled, the monitored items are updated cyclically.
        This option should only be enabled if the data structure is not static and may change.
    Default: false
  mdc_trigger_path:
    Type: "String"
    Label:
      DE: "Multi Datachange Trigger Pfad"
      EN: "Multi Datachange Trigger path"
    HelpText:
      DE: "Der Pfad, unter dem alle Datenpunkte rekursiv überwacht werden."
      EN: "The path under which all data points are monitored recursively."
    Default: "bp=Objects;"