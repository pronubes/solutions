FormatVersion: 1
Tags:
  - OPC
  - DB
IconFile: "opc.svg"
DisplayName:
  DE: "Siemens S7 Steuerung zu Datenbank"
  EN: "Siemens S7 PLC to database"
ShortDescription:
  DE: "Datenübertragung von einer Siemens S7 Steuerung zu einer Datenbank"
  EN: "Data transfer from a Siemens S7 PLC to a database"
Parameters:
  opc_client_endpoint:
    Type: "String"
    Label:
      DE: "OPC-UA Endpunkt"
      EN: "OPC-UA endpoint"
    HelpText:
      DE: "Adresse für die Verbindung zur Siemens S7 Steuerung"
      EN: "Address for the connection to the Siemens S7 PLC"
  MSSQL_Server:
    Type: "String"
    Label:
      DE: "Datenbankserver Hostadresse"
      EN: "Database server host address"
    Default: localhost
  MSSQL_port:
    Type: "Integer"
    Label:
      DE: "Datenbankport"
      EN: "Database port"
    Default: 1433
    Min: 0
    Max: 65535
  MSSQL_password_key:
    Type: "SecretKey"
    Label:
      DE: "Datenbankpasswort"
      EN: "Database password"
